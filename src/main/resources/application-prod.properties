# Configuration de production pour Atiko

# Nom de l'application
app.name=Atiko Production

# Configuration du serveur
server.port=8081

# IMPORTANT : Remplacez par votre nom de domaine réel
# Exemples :
# app.cors.allowed-origins=https://atiko.sn,https://www.atiko.sn
# app.cors.allowed-origins=https://votre-domaine.com,https://www.votre-domaine.com
app.cors.allowed-origins=https://votre-domaine.com

# Base de données PostgreSQL - PRODUCTION
# IMPORTANT : Utilisez des variables d'environnement pour les secrets
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/atiko_prod}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration
security.jwt.secret-key=${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
security.jwt.expiration-time=86400000

# Upload de fichiers
app.file.upload-dir=./uploads/files
app.file.storage.mapping=file:./uploads/
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuration email - PRODUCTION
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nadohsite@gmail.com}
spring.mail.password=${MAIL_PASSWORD:rootkit1010..}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.example.Atiko=INFO

# Désactiver les ressources statiques si le frontend est déployé séparément
# spring.web.resources.add-mappings=false
