<!DOCTYPE html>
<html ng-app="myApp" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{back-office/layout/base.html}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${appName} + ' - ' + ${title}">BHC</title>
    <script src="/js/controllers/couponFormController.js" layout:fragment="script"></script>
</head>
<body ng-controller="couponFormController">
    <div layout:fragment="content">
        <div class="card mt-5">
            <div class="card-header">
                <h3 class="card-title" ng-if="!couponDto.id">Nouveau coupon</h3>
                <h3 class="card-title" ng-if="couponDto.id">Modifier le coupon</h3>
            </div>
            <div class="card-body">
                <form id="kt_coupon_form" class="form">
                    <!-- Section Informations générales -->
                    <div class="separator separator-dashed my-8">
                        <span class="w-125px text-gray-500 fw-semibold fs-7">Informations générales</span>
                    </div>
                    <div class="row mb-7 g-3">
                        <div class="col-md-6">
                            <label class="form-label required">Code du coupon</label>
                            <input type="text" class="form-control" ng-model="couponDto.code"
                                placeholder="Ex: PROMO2024" required maxlength="50">
                            <small class="text-muted">Code unique pour identifier le coupon</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Description</label>
                            <input type="text" class="form-control" ng-model="couponDto.description"
                                placeholder="Description du coupon" required maxlength="200">
                        </div>
                    </div>

                    <!-- Section Type et montant -->
                    <div class="separator separator-dashed my-8">
                        <span class="w-125px text-gray-500 fw-semibold fs-7">Type et montant</span>
                    </div>
                    <div class="row mb-7 g-3">
                        <div class="col-md-6">
                            <label class="form-label required">Type de réduction</label>
                            <select class="form-select" ng-model="couponDto.typeReduction" required>
                                <option value="">Sélectionner...</option>
                                <option value="FIXE">Fixe (montant en FCFA)</option>
                                <option value="POURCENTAGE">Pourcentage (%)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Montant</label>
                            <input type="number" class="form-control" ng-model="couponDto.montant"
                                placeholder="0" min="0" step="0.01" required>
                            <small class="text-muted" ng-if="couponDto.typeReduction === 'FIXE'">Montant en FCFA</small>
                            <small class="text-muted" ng-if="couponDto.typeReduction === 'POURCENTAGE'">Pourcentage (0-100)</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Montant minimum requis</label>
                            <input type="number" class="form-control" ng-model="couponDto.montantMinimum"
                                placeholder="0" min="0" step="0.01">
                            <small class="text-muted">Montant minimum de commande pour utiliser ce coupon (optionnel)</small>
                        </div>
                    </div>

                    <!-- Section Dates de validité -->
                    <div class="separator separator-dashed my-8">
                        <span class="w-125px text-gray-500 fw-semibold fs-7">Dates de validité</span>
                    </div>
                    <div class="row mb-7 g-3">
                        <div class="col-md-6">
                            <label class="form-label required">Date de début</label>
                            <input type="date" class="form-control" ng-model="couponDto.dateDebut" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label required">Date de fin</label>
                            <input type="date" class="form-control" ng-model="couponDto.dateFin" required>
                        </div>
                    </div>

                    <!-- Section Utilisations -->
                    <div class="separator separator-dashed my-8">
                        <span class="w-125px text-gray-500 fw-semibold fs-7">Utilisations</span>
                    </div>
                    <div class="row mb-7 g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre maximum d'utilisations</label>
                            <input type="number" class="form-control" ng-model="couponDto.nombreUtilisationsMax"
                                placeholder="Illimité" min="1">
                            <small class="text-muted">Laisser vide pour un nombre illimité d'utilisations</small>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Statut</label>
                            <select class="form-select" ng-model="couponDto.actif">
                                <option ng-value="true">Actif</option>
                                <option ng-value="false">Inactif</option>
                            </select>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="row mb-7 g-3">
                        <div class="col-12 text-center pt-4">
                            <button type="button" class="btn btn-light me-3" onclick="window.history.back()">Annuler</button>
                            <button type="button" ng-click="submitCoupon()" class="btn btn-primary">
                                <span class="indicator-label" ng-if="!couponDto.id">Créer le coupon</span>
                                <span class="indicator-label" ng-if="couponDto.id">Modifier le coupon</span>
                                <span class="indicator-progress" ng-if="loading">Veuillez patienter...
                                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                                </span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
