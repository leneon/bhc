<!DOCTYPE html>
<html ng-app="myApp" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{back-office/layout/base.html}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${appName} + ' - ' + ${title}">BHC</title>
</head>
<body ng-controller="modelesController">
    <div layout:fragment="content">
        <div class="card">
            <div class="card-header border-0 pt-6">
                <div class="card-title">
                    <div class="d-flex align-items-center position-relative my-1">
                        <span class="svg-icon svg-icon-1 position-absolute ms-6">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect opacity="0.5" x="17.0365" y="15.1223" width="8.15546" height="2" rx="1" transform="rotate(45 17.0365 15.1223)" fill="currentColor" />
                                <path d="M11 19C6.55556 19 3 15.4444 3 11C3 6.55556 6.55556 3 11 3C15.4444 3 19 6.55556 19 11C19 15.4444 15.4444 19 11 19ZM11 5C7.53333 5 5 7.53333 5 11C5 14.4667 7.53333 17 11 17C14.4667 17 17 14.4667 17 11C17 7.53333 14.4667 5 11 5Z" fill="currentColor" />
                            </svg>
                        </span>
                        <input type="text" data-kt-modele-table-filter="search" class="form-control form-control-solid w-250px ps-14" placeholder="Rechercher modèle" />
                    </div>
                </div>
                <div class="card-toolbar">
                    <div class="d-flex justify-content-end" data-kt-modele-table-toolbar="base">
                        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#kt_modal_add_modele">
                            <span class="svg-icon svg-icon-2">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <rect opacity="0.5" x="11.364" y="20.364" width="16" height="2" rx="1" transform="rotate(-90 11.364 20.364)" fill="currentColor" />
                                    <rect x="4.36396" y="11.364" width="16" height="2" rx="1" fill="currentColor" />
                                </svg>
                            </span>
                            Nouveau modèle
                        </button>
                    </div>
                    <div class="d-flex justify-content-end align-items-center d-none" data-kt-modele-table-toolbar="selected">
                        <div class="fw-bold me-5">
                            <span class="me-2" data-kt-modele-table-select="selected_count"></span>Sélectionnés
                        </div>
                        <button type="button" class="btn btn-danger" data-kt-modele-table-select="delete_selected">Supprimer</button>
                    </div>

                    <!-- Modal Add/Edit Modele -->
                    <div class="modal fade" id="kt_modal_add_modele" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-dialog-centered mw-750px">
                            <div class="modal-content">
                                <div class="modal-header" id="kt_modal_add_modele_header">
                                    <h2 class="fw-bold">Ajouter un modèle</h2>
                                    <div class="btn btn-icon btn-sm btn-active-icon-primary" data-kt-modeles-modal-action="close">
                                        <span class="svg-icon svg-icon-1">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
                                                <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
                                            </svg>
                                        </span>
                                    </div>
                                </div>
                                <div class="modal-body scroll-y mx-5 mx-xl-15 my-7">
                                    <form id="kt_modal_add_modele_form" class="form">
                                        <input ng-model="modeleDto.id" class="d-none" id="modele_id" name="modele_id" />

                                        <div class="fv-row mb-7">
                                            <label class="required fw-semibold fs-6 mb-2">Nom</label>
                                            <input ng-model="modeleDto.nom" type="text" id="modele_nom" name="modele_nom" class="form-control form-control-solid" placeholder="Nom du modèle" />
                                        </div>

                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="fv-row mb-7">
                                                    <label class="required fw-semibold fs-6 mb-2">Catégorie</label>
                                                    <select ng-model="modeleDto.categorieId" id="modele_categorie" name="modele_categorie" class="form-control form-control-solid">
                                                        <option value="">-- Sélectionner --</option>
                                                        <option ng-repeat="cat in listecategories" value="{{cat.id}}">{{cat.nom}}</option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="fv-row mb-7">
                                                    <label class="required fw-semibold fs-6 mb-2">Marque</label>
                                                    <select ng-model="modeleDto.marqueId" id="modele_marque" name="modele_marque" class="form-control form-control-solid">
                                                        <option value="">-- Sélectionner --</option>
                                                        <option ng-repeat="marque in listeMarques" value="{{marque.id}}">{{marque.nom}}</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="fv-row mb-7">
                                                    <label class="fw-semibold fs-6 mb-2">Année Sortie</label>
                                                    <input ng-model="modeleDto.anneeSortie" type="number" id="modele_annee" name="modele_annee" class="form-control form-control-solid" placeholder="2024" />
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="fv-row mb-7">
                                                    <label class="fw-semibold fs-6 mb-2">Puissance (ch)</label>
                                                    <input ng-model="modeleDto.puissance" type="number" id="modele_puissance" name="modele_puissance" class="form-control form-control-solid" placeholder="150" />
                                                </div>
                                            </div>

                                            <div class="col-md-6">
                                                <div class="fv-row mb-7">
                                                    <label class="fw-semibold fs-6 mb-2">Puissance (ch)</label>
                                                    <input ng-model="modeleDto.puissance" type="number" id="modele_puissance" name="modele_puissance" class="form-control form-control-solid" placeholder="150" />
                                                </div>
                                            </div>


                                            <div class="col-md-6">
                                            <label class="fw-semibold fs-6 mb-2">Type Moteur</label>
                                            <select ng-model="modeleDto.typeMoteur" id="modele_moteur" name="modele_moteur" class="form-control form-control-solid">
                                                <option value="">-- Sélectionner --</option>
                                                <option value="Essence">Essence</option>
                                                <option value="Diesel">Diesel</option>
                                                <option value="Hybride">Hybride</option>
                                                <option value="Électrique">Électrique</option>
                                            </select>
                                        </div>
                                        </div>

                                        

                                        <div class="fv-row mb-7">
                                            <label class="fw-semibold fs-6 mb-2">Description</label>
                                            <textarea ng-model="modeleDto.description" id="modele_description" name="modele_description" class="form-control form-control-solid" rows="3" placeholder="Description (optionnel)"></textarea>
                                        </div>

                                        <div class="text-center pt-15">
                                            <button type="reset" class="btn btn-light me-3" data-kt-modeles-modal-action="cancel">Annuler</button>
                                            <button type="button" class="btn btn-primary" data-kt-modeles-modal-action="submit">
                                                <span class="indicator-label">Enregistrer</span>
                                                <span class="indicator-progress">Veuillez patienter...
                                                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span>
                                                </span>
                                            </button>
                                        </div> 
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-body py-4 table-responsive">
                <table class="table align-middle table-row-dashed fs-6 gy-5" id="kt_table_modeles">
                    <thead>
                        <tr class="text-start text-muted fw-bold fs-7 text-uppercase gs-0">
                            <th class="w-10px pe-2">
                                <div class="form-check form-check-sm form-check-custom form-check-solid me-3">
                                    <input class="form-check-input" type="checkbox" data-kt-check="true" data-kt-check-target="#kt_table_modeles .form-check-input" value="1" />
                                </div>
                            </th>
                            <th class="min-w-150px">Nom</th>
                            <th class="min-w-120px">Catégorie</th>
                            <th class="min-w-120px">Marque</th>
                            <th class="min-w-100px">Année</th>
                            <th class="min-w-120px">Moteur</th>
                            <th class="min-w-100px">Puissance</th>
                            <th class="min-w-100px">Statut</th>
                            <th class="text-end min-w-100px">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-600 fw-semibold">
                        <tr ng-repeat="modele in listemodeles">
                            <td>
                                <div class="form-check form-check-sm form-check-custom form-check-solid">
                                    <input class="form-check-input" type="checkbox" value="{{modele.id}}" />
                                </div>
                            </td>
                            <td>{{ modele.nom }}</td>
                            <td>{{ modele.categorieName }}</td>
                            <td>{{ modele.marqueName }}</td>
                            <td>{{ modele.anneeSortie }}</td>
                            <td>{{ modele.typeMoteur }}</td>
                            <td>{{ modele.puissance }} ch</td>
                            <td>
                                <span ng-if="modele.statut" class="badge badge-success">Activé</span>
                                <span ng-if="!modele.statut" class="badge badge-danger">Désactivé</span>
                            </td>
                            <td>
                                <div class="d-flex justify-content-end flex-shrink-0">
                                    <a ng-click="disableModele(modele.id)" class="btn btn-icon btn-bg-light btn-active-color-warning btn-sm me-1">
                                        <span class="svg-icon svg-icon-3">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M17.5 11H6.5C4 11 2 9 2 6.5C2 4 4 2 6.5 2H17.5C20 2 22 4 22 6.5C22 9 20 11 17.5 11ZM15 6.5C15 7.9 16.1 9 17.5 9C18.9 9 20 7.9 20 6.5C20 5.1 18.9 4 17.5 4C16.1 4 15 5.1 15 6.5Z" fill="currentColor"></path>
                                                <path opacity="0.3" d="M17.5 22H6.5C4 22 2 20 2 17.5C2 15 4 13 6.5 13H17.5C20 13 22 15 22 17.5C22 20 20 22 17.5 22ZM4 17.5C4 18.9 5.1 20 6.5 20C7.9 20 9 18.9 9 17.5C9 16.1 7.9 15 6.5 15C5.1 15 4 16.1 4 17.5Z" fill="currentColor"></path>
                                            </svg>
                                        </span>
                                    </a>
                                    <a ng-click="findmodeleById(modele.id)" class="btn btn-icon btn-bg-light btn-active-color-primary btn-sm me-1">
                                        <span class="svg-icon svg-icon-3">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path opacity="0.3" d="M21.4 8.35303L19.241 10.511L13.485 4.755L15.643 2.59595C16.0248 2.21423 16.5426 1.99988 17.0825 1.99988C17.6224 1.99988 18.1402 2.21423 18.522 2.59595L21.4 5.474C21.7817 5.85581 21.9962 6.37355 21.9962 6.91345C21.9962 7.45335 21.7817 7.97122 21.4 8.35303ZM3.68699 21.932L9.88699 19.865L4.13099 14.109L2.06399 20.309C1.98815 20.5354 1.97703 20.7787 2.03189 21.0111C2.08674 21.2436 2.2054 21.4561 2.37449 21.6248C2.54359 21.7934 2.75641 21.9115 2.989 21.9658C3.22158 22.0201 3.4647 22.0084 3.69099 21.932H3.68699Z" fill="currentColor"></path>
                                                <path d="M5.574 21.3L3.692 21.928C3.46591 22.0032 3.22334 22.0141 2.99144 21.9594C2.75954 21.9046 2.54744 21.7864 2.3789 21.6179C2.21036 21.4495 2.09202 21.2375 2.03711 21.0056C1.9822 20.7737 1.99289 20.5312 2.06799 20.3051L2.696 18.422L5.574 21.3ZM4.13499 14.105L9.891 19.861L19.245 10.507L13.489 4.75098L4.13499 14.105Z" fill="currentColor"></path>
                                            </svg>
                                        </span>
                                    </a>
                                    <a ng-click="deletemodele(modele.id)" class="btn btn-icon btn-bg-light btn-active-color-danger btn-sm">
                                        <span class="svg-icon svg-icon-3">
                                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M5 9C5 8.44772 5.44772 8 6 8H18C18.5523 8 19 8.44772 19 9V18C19 19.6569 17.6569 21 16 21H8C6.34315 21 5 19.6569 5 18V9Z" fill="currentColor"></path>
                                                <path opacity="0.5" d="M5 5C5 4.44772 5.44772 4 6 4H18C18.5523 4 19 4.44772 19 5V5C19 5.55228 18.5523 6 18 6H6C5.44772 6 5 5.55228 5 5V5Z" fill="currentColor"></path>
                                                <path opacity="0.5" d="M9 4C9 3.44772 9.44772 3 10 3H14C14.5523 3 15 3.44772 15 4V4H9V4Z" fill="currentColor"></path>
                                            </svg>
                                        </span>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/controllers/modelesController.js" layout:fragment="script"></script>
</body>
</html>
